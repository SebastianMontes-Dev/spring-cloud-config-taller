server.port=8084
application.message=Welcome From Loan Service MySQL (default)
spring.datasource.url=jdbc:mysql://localhost:3308/loans_db
spring.datasource.username=loans
# Sin valor a proposito: el Config Server no resuelve ${MYSQL_PASSWORD} (no esta en su entorno)
# y lo deja literal; el cliente lo resuelve con su propia variable de entorno.
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
