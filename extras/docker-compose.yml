# Extras del taller: MySQL + Config Server + loan-service-mysql.
# Uso (desde extras/):  copiar .env.example a .env, completar y luego:  docker compose up -d --build
name: spring-cloud-config-taller

services:
  mysql:
    image: mysql:8
    container_name: taller-cfg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?definir MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: loans_db
      MYSQL_USER: loans
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definir MYSQL_PASSWORD en .env}
    ports:
      - "${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - taller_cfg_mysql:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  config-server:
    build:
      context: ..
      dockerfile: extras/docker/Dockerfile
      args:
        MODULE: config-server
    container_name: taller-cfg-config-server
    restart: unless-stopped
    environment:
      # Suma la carpeta extras/config a la ubicacion del taller, sin editar sus archivos.
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/config,file:/extras-config/
    volumes:
      - ./config:/extras-config:ro
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/loan-service/default >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  loan-service-mysql:
    build:
      context: ..
      dockerfile: extras/docker/Dockerfile
      args:
        MODULE: extras/loan-service-mysql
    container_name: taller-cfg-loan-service-mysql
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      CONFIG_SERVER_URL: http://config-server:8888
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?definir MYSQL_PASSWORD en .env}
    depends_on:
      mysql:
        condition: service_healthy
      config-server:
        condition: service_healthy
    ports:
      - "8084:8084"

volumes:
  taller_cfg_mysql:
