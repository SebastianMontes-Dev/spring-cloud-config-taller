spring.application.name=loan-service-mysql
# Sin "optional:": si el Config Server no responde, el arranque falla con un mensaje claro
# (la URL del datasource viene del servidor, no hay valor local con el que continuar).
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
