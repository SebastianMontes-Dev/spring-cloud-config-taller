# Perfil "git" del Config Server (extra). Se activa SIN editar el application.properties del taller:
#   SPRING_PROFILES_ACTIVE=git
#   SPRING_CONFIG_ADDITIONAL_LOCATION=file:<ruta>/extras/git-backend/
#   CONFIG_GIT_URI=<url o file:// del repositorio con la configuracion>
# El valor de SPRING_PROFILES_ACTIVE (variable de entorno) tiene precedencia sobre spring.profiles.active=native.
spring.cloud.config.server.git.uri=${CONFIG_GIT_URI}
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.search-paths=extras/git-backend/config-repo
spring.cloud.config.server.git.clone-on-start=true
